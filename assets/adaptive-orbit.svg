<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Adaptive Toolkit flowing space</title>
  <desc id="desc">An original abstract mark formed by layered spatial contours and an open passage</desc>

  <defs>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.8"
        numOctaves="2"
        seed="17"
        result="noise"
      />
      <feComposite
        in="noise"
        in2="SourceGraphic"
        operator="in"
        result="texture"
      />
      <feBlend
        in="SourceGraphic"
        in2="texture"
        mode="multiply"
      />
    </filter>

    <clipPath id="frame">
      <rect x="5" y="5" width="86" height="86" rx="2"/>
    </clipPath>
  </defs>

  <rect
    x="5"
    y="5"
    width="86"
    height="86"
    rx="2"
    fill="#f3f0e8"
    stroke="#111111"
    stroke-width="1"
  />

